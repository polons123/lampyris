name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Тесты и проверки
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Версии
        run: |
          sw_vers
          swift --version
          xcodebuild -version
      - name: Проверки скриптов и JS
        run: scripts/check.sh
      # swift test собирает весь пакет, в том числе приложение, поэтому для линковки нужны библиотеки mpv.
      - name: Библиотеки mpv (arm64)
        run: scripts/fetch-libs.sh arm64
      - name: Тесты
        env:
          LAMPA_LIBS: ${{ github.workspace }}/build/libs/arm64
        run: swift test

  build:
    name: Сборка ${{ matrix.arch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - name: Сборка Lampyris.app
        run: scripts/build-app.sh ${{ matrix.arch }}
      - name: Дымовой запуск (воспроизведение тестового видео, не блокирует)
        continue-on-error: true
        run: |
          APP="dist/${{ matrix.arch }}/Lampyris.app"
          LAMPA_MPV_TEST='av://lavfi:testsrc=duration=8:size=320x180:rate=25' "$APP/Contents/MacOS/Lampyris" > smoke.log 2>&1 &
          PID=$!
          sleep 9
          kill $PID 2>/dev/null || true
          cat smoke.log
          # При падении показываем начало отчёта о сбое, чтобы понять причину на раннере.
          for r in $(ls -t ~/Library/Logs/DiagnosticReports/Lampyris* 2>/dev/null | head -1); do echo "--- $r"; head -70 "$r"; done
          grep -q "video-codec" smoke.log
      - uses: actions/upload-artifact@v4
        with:
          name: Lampyris-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  windows-test:
    name: Тесты (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - name: Тесты (разбор mpv.conf, журнал, мост)
        working-directory: windows
        run: cargo test --release --locked

  windows-build:
    name: Сборка Windows ${{ matrix.arch }}
    needs: windows-test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
          key: ${{ matrix.arch }}
      - name: Сборка пакета
        shell: pwsh
        run: windows/scripts/build-windows.ps1 -Arch ${{ matrix.arch }}
      - name: Дымовой запуск (воспроизведение тестового видео, не блокирует)
        continue-on-error: true
        shell: pwsh
        run: windows/scripts/smoke.ps1 -Dir (Get-ChildItem dist -Directory -Filter 'Lampyris-*-windows-${{ matrix.arch }}').FullName
      - name: Установщик
        shell: pwsh
        run: windows/scripts/build-installer.ps1 -Arch ${{ matrix.arch }} -InstallInnoIfMissing
      - uses: actions/upload-artifact@v4
        with:
          name: Lampyris-windows-${{ matrix.arch }}
          path: |
            dist/Lampyris-*-windows-${{ matrix.arch }}.zip
            dist/Lampyris-*-windows-${{ matrix.arch }}-portable.zip
            dist/Lampyris-*-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error

  # Раннеры Windows на ARM доступны только для публичных репозиториев (сейчас репозиторий публичный): для приватного задача пропускается.
  windows-build-arm64:
    name: Сборка Windows arm64
    needs: windows-test
    if: ${{ !github.event.repository.private }}
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
          key: arm64
      - name: Сборка пакета
        shell: pwsh
        run: windows/scripts/build-windows.ps1 -Arch arm64
      - name: Дымовой запуск (не блокирует)
        continue-on-error: true
        shell: pwsh
        run: windows/scripts/smoke.ps1 -Dir (Get-ChildItem dist -Directory -Filter 'Lampyris-*-windows-arm64').FullName
      - name: Установщик
        shell: pwsh
        run: windows/scripts/build-installer.ps1 -Arch arm64 -InstallInnoIfMissing
      - uses: actions/upload-artifact@v4
        with:
          name: Lampyris-windows-arm64
          path: |
            dist/Lampyris-*-windows-arm64.zip
            dist/Lampyris-*-windows-arm64-portable.zip
            dist/Lampyris-*-windows-arm64-setup.exe
          if-no-files-found: error

  android-build:
    name: Сборка Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Нативные библиотеки (скачиваются из релиза mpv-android, суммы проверяются)
        working-directory: android
        run: scripts/fetch-libs.sh
      - name: Проверки Android (тесты, Android Lint)
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug :app:check
      # Подписанный релиз собирается только для тегов (ключ есть только в секретах репозитория).
      - name: Ключ подписи
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then echo "Нет секрета ANDROID_KEYSTORE_B64" >&2; exit 1; fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/android-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/android-release.jks" >> "$GITHUB_ENV"
      - name: Подписанные APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease
          V="$(cat ../scripts/VERSION)"
          mkdir -p ../dist
          for pair in arm64-v8a:arm64 armeabi-v7a:arm32 universal:universal; do
            cp "app/build/outputs/apk/release/app-${pair%%:*}-release.apk" "../dist/Lampyris-$V-android-${pair##*:}.apk"
          done
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs ../dist/*.apk | grep -E "SHA-256|Verified"
      - uses: actions/upload-artifact@v4
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: Lampyris-android
          path: dist/Lampyris-*-android-*.apk
          if-no-files-found: error

  release:
    name: Публикация релиза
    # Сборка arm64 для Windows может быть пропущена (если репозиторий станет приватным): остальные должны пройти.
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.build.result == 'success' && needs.windows-build.result == 'success' && needs.android-build.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.windows-build-arm64.result) }}
    needs: [build, windows-build, windows-build-arm64, android-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Тег должен совпадать с версией в scripts/VERSION
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "$(cat scripts/VERSION)" ]; then
            echo "Тег ${GITHUB_REF_NAME} не совпадает с scripts/VERSION ($(cat scripts/VERSION))" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Контрольные суммы и релиз
        env:
          GH_TOKEN: ${{ github.token }}
          # Закрытый ключ Ed25519 (PEM) для подписи списка контрольных сумм; открытый ключ вшит в приложения (LampyrisCore/Update.swift, windows/src/update.rs).
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          cd dist
          shasum -a 256 *.dmg *.zip *-setup.exe *.apk > SHA256SUMS.txt
          # Приложения обновляются сами и доверяют только подписанному SHA256SUMS.txt: без ключа релиз не выпускаем.
          if [ -z "$UPDATE_SIGNING_KEY" ]; then echo "Нет секрета UPDATE_SIGNING_KEY" >&2; exit 1; fi
          umask 077
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/update-key.pem"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/update-key.pem" -rawin -in SHA256SUMS.txt -out SHA256SUMS.txt.sig
          rm -f "$RUNNER_TEMP/update-key.pem"
          [ "$(wc -c < SHA256SUMS.txt.sig)" -eq 64 ]
          gh release create "${{ github.ref_name }}" *.dmg *.zip *-setup.exe *.apk SHA256SUMS.txt SHA256SUMS.txt.sig --repo "${{ github.repository }}" --generate-notes
