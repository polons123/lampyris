name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Тесты и проверки
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Версии
        run: |
          sw_vers
          swift --version
          xcodebuild -version
      - name: Проверки скриптов и JS
        run: scripts/check.sh
      # swift test собирает весь пакет, в том числе приложение, поэтому для линковки нужны библиотеки mpv.
      - name: Библиотеки mpv (arm64)
        run: scripts/fetch-libs.sh arm64
      - name: Тесты
        env:
          LAMPA_LIBS: ${{ github.workspace }}/build/libs/arm64
        run: swift test

  build:
    name: Сборка ${{ matrix.arch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - name: Сборка Lampyris.app
        run: scripts/build-app.sh ${{ matrix.arch }}
      - name: Дымовой запуск (воспроизведение тестового видео, не блокирует)
        continue-on-error: true
        run: |
          APP="dist/${{ matrix.arch }}/Lampyris.app"
          LAMPA_MPV_TEST='av://lavfi:testsrc=duration=8:size=320x180:rate=25' "$APP/Contents/MacOS/Lampyris" > smoke.log 2>&1 &
          PID=$!
          sleep 9
          kill $PID 2>/dev/null || true
          cat smoke.log
          # При падении показываем начало отчёта о сбое, чтобы понять причину на раннере.
          for r in $(ls -t ~/Library/Logs/DiagnosticReports/Lampyris* 2>/dev/null | head -1); do echo "--- $r"; head -70 "$r"; done
          grep -q "video-codec" smoke.log
      - uses: actions/upload-artifact@v4
        with:
          name: Lampyris-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  windows-test:
    name: Тесты (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - name: Тесты (разбор mpv.conf, журнал, мост)
        working-directory: windows
        run: cargo test --release --locked

  windows-build:
    name: Сборка Windows ${{ matrix.arch }}
    needs: windows-test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
          key: ${{ matrix.arch }}
      - name: Сборка пакета
        shell: pwsh
        run: windows/scripts/build-windows.ps1 -Arch ${{ matrix.arch }}
      - name: Дымовой запуск (воспроизведение тестового видео, не блокирует)
        continue-on-error: true
        shell: pwsh
        run: windows/scripts/smoke.ps1 -Dir (Get-ChildItem dist -Directory -Filter 'Lampyris-*-windows-${{ matrix.arch }}').FullName
      - name: Установщик
        shell: pwsh
        run: windows/scripts/build-installer.ps1 -Arch ${{ matrix.arch }} -InstallInnoIfMissing
      - uses: actions/upload-artifact@v4
        with:
          name: Lampyris-windows-${{ matrix.arch }}
          path: |
            dist/Lampyris-*-windows-${{ matrix.arch }}.zip
            dist/Lampyris-*-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error

  # Раннеры Windows на ARM бесплатны только для публичных репозиториев: для приватного задача пропускается.
  windows-build-arm64:
    name: Сборка Windows arm64
    needs: windows-test
    if: ${{ !github.event.repository.private }}
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
          key: arm64
      - name: Сборка пакета
        shell: pwsh
        run: windows/scripts/build-windows.ps1 -Arch arm64
      - name: Дымовой запуск (не блокирует)
        continue-on-error: true
        shell: pwsh
        run: windows/scripts/smoke.ps1 -Dir (Get-ChildItem dist -Directory -Filter 'Lampyris-*-windows-arm64').FullName
      - name: Установщик
        shell: pwsh
        run: windows/scripts/build-installer.ps1 -Arch arm64 -InstallInnoIfMissing
      - uses: actions/upload-artifact@v4
        with:
          name: Lampyris-windows-arm64
          path: |
            dist/Lampyris-*-windows-arm64.zip
            dist/Lampyris-*-windows-arm64-setup.exe
          if-no-files-found: error

  release:
    name: Публикация релиза
    # Сборка arm64 для Windows может быть пропущена (приватный репозиторий): остальные должны пройти.
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.build.result == 'success' && needs.windows-build.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.windows-build-arm64.result) }}
    needs: [build, windows-build, windows-build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Контрольные суммы и релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          shasum -a 256 *.dmg *.zip *-setup.exe > SHA256SUMS.txt
          gh release create "${{ github.ref_name }}" *.dmg *.zip *-setup.exe SHA256SUMS.txt --repo "${{ github.repository }}" --generate-notes
